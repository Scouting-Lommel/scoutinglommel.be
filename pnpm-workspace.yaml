allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# next's optional sharp (^0.34.3, <0.35.0) is vulnerable; we declare sharp@^0.35.0 directly instead
ignoredOptionalDependencies:
  - sharp

# next exact-pins postcss 8.4.31 (CVE fixed in 8.5.10; Vercel bumped it in canary only)
overrides:
  postcss: '>=8.5.10'

minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@15.5.21'
  - chromatic@18.1.0
  - eslint-config-next@15.5.21
  - icu-minify@4.13.3
  - next-intl-swc-plugin-extractor@4.13.3
  - next-intl@4.13.3
  - use-intl@4.13.3
  - '@next/env@15.5.21'
  - '@next/swc-darwin-arm64@15.5.21'
  - '@next/swc-darwin-x64@15.5.21'
  - '@next/swc-linux-arm64-gnu@15.5.21'
  - '@next/swc-linux-arm64-musl@15.5.21'
  - '@next/swc-linux-x64-gnu@15.5.21'
  - '@next/swc-linux-x64-musl@15.5.21'
  - '@next/swc-win32-arm64-msvc@15.5.21'
  - '@next/swc-win32-x64-msvc@15.5.21'
  - next@15.5.21

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
